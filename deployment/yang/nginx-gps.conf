# /etc/nginx/sites-available/gps: the plots tree at /gps/, the path it has on
# the CDN, so moving to cdn.vedur.is later changes only the hostname.
# Directory listings are required: aflogun finds figures by reading their hrefs.
server {
    listen 80 default_server;
    server_name yang-d01.vedur.is;

    # IMO's network only (confirm the ranges)
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    deny all;

    location /gps/ {
        alias /mnt/data/gpsops/plots/;
        autoindex on;
        autoindex_exact_size off;
        # the Vöktun page polls these: never serve an old one
        location ~ \.status\.json$ {
            add_header Cache-Control "no-store";
        }
    }

    # run manifests and fingerprints are not part of the published tree
    location /gps/_runs/ {
        return 404;
    }
}
